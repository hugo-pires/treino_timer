<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Treino Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-setup" class="screen active">
    <div class="tab-panels">

      <div class="tab-panel active" id="tab-treino" role="tabpanel">
        <h1>Treino</h1>
        <div class="section-label">Planos guardados</div>
        <div class="plan-cards" id="presets"></div>
        <div class="section-label" id="draft-label" hidden>Plano em edição</div>
        <div class="plan-cards" id="draft-card"></div>
      </div>

      <div class="tab-panel" id="tab-plano" role="tabpanel">
        <h1>Plano</h1>
        <div class="section-label">Exercícios</div>
        <div class="exercise-list" id="exercise-list"></div>

        <form id="add-exercise-form">
          <div class="field grow">
            <label for="ex-name">Exercício</label>
            <input type="text" id="ex-name" placeholder="ex: Flexões" maxlength="30">
          </div>
          <div class="add-exercise-row">
            <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Tipo de exercício">
              <button type="button" class="mode-btn active" data-mode="time">Tempo</button>
              <button type="button" class="mode-btn" data-mode="reps">Repetições</button>
            </div>
            <div class="field narrow">
              <label for="ex-value" id="ex-value-label">Segundos</label>
              <input type="number" id="ex-value" min="1" max="3600" value="30">
            </div>
            <button id="btn-add-exercise" type="submit" class="secondary add-btn">+</button>
          </div>
        </form>

        <div class="section-label">Definições</div>
        <div class="global-fields">
          <div class="field">
            <label for="prepare">Preparação (s)</label>
            <input type="number" id="prepare" min="0" max="60" value="10">
          </div>
          <div class="field">
            <label for="rest">Descanso (s)</label>
            <input type="number" id="rest" min="0" max="600" value="15">
          </div>
          <div class="field">
            <label for="rounds">Repetir circuito</label>
            <input type="number" id="rounds" min="1" max="99" value="1">
          </div>
          <div class="field">
            <label for="preset-name">Nome do plano (p/ guardar)</label>
            <input type="text" id="preset-name" placeholder="ex: Treino de casa">
          </div>
        </div>

        <div class="setup-actions">
          <button id="btn-save-preset" class="secondary">Guardar</button>
          <button id="btn-start" class="primary">Começar</button>
        </div>
      </div>

      <div class="tab-panel" id="tab-catalogo" role="tabpanel">
        <h1>Catálogo</h1>
        <div class="section-label">Exercícios guardados</div>
        <div class="exercise-list" id="catalog"></div>
      </div>

      <div class="tab-panel" id="tab-historico" role="tabpanel">
        <h1>Histórico</h1>
        <div class="stats" id="history-stats"></div>
        <div class="section-label">Treinos concluídos</div>
        <div class="history-list" id="history-list"></div>
      </div>

    </div>

    <div class="toast" id="toast" hidden></div>

    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Secções">
      <button class="tab-btn active" data-tab="treino" role="tab">
        <svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8V4z"/></svg><span>Treino</span>
      </button>
      <button class="tab-btn" data-tab="plano" role="tab">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/></svg><span>Plano</span>
      </button>
      <button class="tab-btn" data-tab="catalogo" role="tab">
        <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Catálogo</span>
      </button>
      <button class="tab-btn" data-tab="historico" role="tab">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.64 2.64A8.96 8.96 0 0 0 12 3zm-1 5v5l4 2 .8-1.6-3-1.4V8z"/></svg><span>Histórico</span>
      </button>
    </nav>
  </section>

  <section id="screen-run" class="screen">
    <div class="round-label" id="round-label">Série 1 / 8</div>

    <div class="ring-wrap" id="ring-wrap">
      <svg class="ring" viewBox="0 0 240 240">
        <circle class="ring-track" cx="120" cy="120" r="108"></circle>
        <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108"></circle>
      </svg>
      <div class="ring-center">
        <div class="phase-label" id="phase-label">TRABALHO</div>
        <div class="time-display" id="time-display">00:40</div>
        <div class="reps-count" id="reps-count" hidden>× 12</div>
        <div class="reps-hint" id="reps-hint" hidden>repetições</div>
      </div>
    </div>

    <div class="run-actions" id="run-actions-time">
      <button id="btn-pause" class="secondary round">
        <svg id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg id="icon-play" viewBox="0 0 24 24" hidden><path d="M7 4l14 8-14 8V4z"/></svg>
      </button>
      <button id="btn-skip" class="secondary round">
        <svg viewBox="0 0 24 24"><path d="M6 4l12 8-12 8V4z"/><rect x="18" y="4" width="2.5" height="16" rx="1"/></svg>
      </button>
      <button id="btn-stop" class="danger round">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>

    <div class="run-actions" id="run-actions-reps" hidden>
      <button id="btn-done" class="primary">Concluído</button>
      <button id="btn-stop-reps" class="danger round">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>
  </section>

  <section id="screen-done" class="screen">
    <div class="done-icon">✔</div>
    <h2>Treino terminado</h2>
    <button id="btn-again" class="primary">Voltar ao início</button>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
